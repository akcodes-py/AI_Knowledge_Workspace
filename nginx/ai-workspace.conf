# ============================================================
# AI Knowledge Workspace — Nginx Reverse Proxy Config
# Hides :8001 and :3000 behind a single port 80 / 443
# ============================================================
# Place at: /etc/nginx/sites-available/ai-workspace
# Enable:   sudo ln -s /etc/nginx/sites-available/ai-workspace /etc/nginx/sites-enabled/
# Test:     sudo nginx -t
# Reload:   sudo systemctl reload nginx
# ============================================================

upstream backend {
    server 127.0.0.1:8001;
    keepalive 16;
}

upstream frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name localhost _;   # Replace with your domain e.g. aiworkspace.com

    # ── Security headers ───────────────────────────────────
    add_header X-Content-Type-Options    "nosniff"     always;
    add_header X-Frame-Options           "SAMEORIGIN"  always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── Gzip compression ───────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # ── Hide backend port from clients ─────────────────────
    # All /api/* requests → FastAPI backend (port 8001 invisible)
    location /api/ {
        proxy_pass         http://backend/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Allow large file uploads (PDF, audio)
        client_max_body_size 50M;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── Next.js frontend ───────────────────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # ── Static file caching ────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        proxy_pass http://frontend;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

