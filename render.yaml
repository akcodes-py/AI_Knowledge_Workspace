# ============================================================
# Render Blueprint — Backend + PostgreSQL
# https://render.com/docs/blueprint-spec
# ============================================================

databases:
  - name: ai-workspace-db
    plan: free
    databaseName: ai_workspace
    user: ai_workspace_user
    postgresMajorVersion: "16"

services:
  - type: web
    name: ai-workspace-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-workspace-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: EMBED_MODEL
        value: all-MiniLM-L6-v2
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
