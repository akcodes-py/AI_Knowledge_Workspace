services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai_workspace_postgres
    restart: always
    environment:
      POSTGRES_DB: ai_workspace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_workspace"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_workspace_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/ai_workspace
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      EMBED_MODEL: ${EMBED_MODEL:-all-MiniLM-L6-v2}
      JWT_SECRET: ${JWT_SECRET:-ai-workspace-secret-key-32chars-min}
      BACKEND_PORT: 8001
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://localhost:8001
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_workspace_frontend
    restart: always
    environment:
      BACKEND_URL: http://backend:8001
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: ai_workspace_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
